<div class="flex flex-wrap items-center mx-3">
    <div class="flex-col justify-center hidden w-6/12 max-w-full p-3 pr-0 my-auto text-center flex-0 lg:flex">
        <img src="/assets/dashboardImages/backLogin.png" alt="" class="rounded-xl overflow-hidden"
            style="height: 100vh;" />
    </div>
    <div class="flex flex-col w-full max-w-full px-3 shrink-0 md:flex-0 md:w-6/12 lg:w-5/12 xl:w-4/12 ml-auto">
        <div
            class="relative flex flex-col min-w-0 break-words bg-transparent border-0 shadow-none lg:py4 dark:bg-gray-950 rounded-2xl bg-clip-border">
            <div class="p-6 pb-0 mb-0">
                <h4 class="font-bold">Sign In</h4>
                <p class="mb-0">Enter your email and password to sign in</p>
            </div>
            <div class="flex-auto p-6">
                <form (ngSubmit)="onSubmit()">
                    <div class="mb-4">
                        <input type="text" placeholder="Phone Number" name="phoneNumber"
                            [(ngModel)]="loginDto.PhoneNumber"
                            class="focus:shadow-primary-outline dark:bg-gray-950 dark:placeholder:text-white/80 dark:text-white/80 text-sm leading-5.6 ease block w-full appearance-none rounded-lg border border-solid border-gray-300 bg-white bg-clip-padding p-3 font-normal text-gray-700 outline-none transition-all placeholder:text-gray-500 focus:border-fuchsia-300 focus:outline-none" />
                    </div>
                    <div class="mb-4">
                        <input type="password" placeholder="Password" name="password" [(ngModel)]="loginDto.Password"
                            class="focus:shadow-primary-outline dark:bg-gray-950 dark:placeholder:text-white/80 dark:text-white/80 text-sm leading-5.6 ease block w-full appearance-none rounded-lg border border-solid border-gray-300 bg-white bg-clip-padding p-3 font-normal text-gray-700 outline-none transition-all placeholder:text-gray-500 focus:border-fuchsia-300 focus:outline-none" />
                    </div>
                    <!-- <div class="flex items-center pl-12 mb-0.5 text-left min-h-6">
                        <input id="rememberMe"
                            class="mt-0.5 rounded-10 duration-250 ease-in-out after:rounded-circle after:shadow-2xl after:duration-250 checked:after:translate-x-5.3 h-5 relative float-left -ml-12 w-10 cursor-pointer appearance-none border border-solid border-gray-200 bg-zinc-700/10 bg-none bg-contain bg-left bg-no-repeat align-top transition-all after:absolute after:top-px after:h-4 after:w-4 after:translate-x-px after:bg-white after:content-[''] checked:border-blue-500/95 checked:bg-blue-500/95 checked:bg-none checked:bg-right"
                            type="checkbox" />
                        <label class="ml-2 font-normal cursor-pointer select-none text-sm text-slate-700"
                            for="rememberMe">Remember
                            me</label>
                    </div> -->
                    <div class="text-center flex flex-col gap-3">
                        <button type="submit"
                            class="inline-block w-full px-16 py-3.5 mt-3 mb-0 font-bold leading-normal text-center text-white align-middle transition-all bg-blue-500 border-0 rounded-lg cursor-pointer hover:-translate-y-px active:opacity-85 hover:shadow-xs text-sm ease-in tracking-tight-rem shadow-md bg-150 bg-x-25">
                            Sign in
                        </button>
                        <button routerLink="/" type="button"
                            class="inline-block w-full px-16 py-3.5 mt-0 mb-0 font-bold leading-normal text-center text-white align-middle transition-all bg-slate-700 border-0 rounded-lg cursor-pointer hover:-translate-y-px active:opacity-85 hover:shadow-xs text-sm ease-in tracking-tight-rem shadow-md bg-150 bg-x-25">
                            Back to Home Page
                        </button>
                    </div>
                </form>

            </div>
            <div class="border-black/12.5 rounded-b-2xl border-t-0 border-solid p-6 text-center pt-0 px-1 sm:px-6">
                <p class="mx-auto mb-6 leading-normal text-sm">Don't have an account?
                    <a routerLink="/auth/signup"
                        class="font-semibold text-transparent bg-clip-text bg-gradient-to-tl from-blue-500 to-violet-500">
                        Sign up
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
