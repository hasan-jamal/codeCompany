<div class="flex flex-wrap -mx-3">
    <div class="flex flex-col w-full max-w-full px-3 lg:mx-0 shrink-0 md:flex-0 md:w-7/12 lg:w-5/12 xl:w-4/12">
        <div
            class="relative flex flex-col min-w-0 break-words bg-transparent border-0 shadow-none lg:py4 dark:bg-gray-950 rounded-2xl bg-clip-border">
            <div class="p-6 pb-0 mb-0">
                <h4 class="font-bold">Sign Up</h4>
                <p class="mb-0">Enter your email and password to sign in</p>
            </div>
            <div class="flex-auto p-6">
                <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4 flex flex-col gap-2">

                    <input type="text" placeholder="Full Name" formControlName="fullName"
                        class="block w-full rounded-lg border border-gray-300 bg-white p-3 text-sm text-gray-700 placeholder-gray-500 outline-none focus:border-blue-400 focus:shadow-md dark:bg-gray-950 dark:text-white/80 dark:placeholder:text-white/60" />

                    <input type="email" placeholder="Email" formControlName="email"
                        class="block w-full rounded-lg border border-gray-300 bg-white p-3 text-sm text-gray-700 placeholder-gray-500 outline-none focus:border-blue-400 focus:shadow-md dark:bg-gray-950 dark:text-white/80 dark:placeholder:text-white/60" />

                    <input type="password" placeholder="Password (min 6 characters)" formControlName="password"
                        class="block w-full rounded-lg border border-gray-300 bg-white p-3 text-sm text-gray-700 placeholder-gray-500 outline-none focus:border-blue-400 focus:shadow-md dark:bg-gray-950 dark:text-white/80 dark:placeholder:text-white/60" />

                    <input type="tel" placeholder="Phone Number" formControlName="phoneNumber"
                        class="block w-full rounded-lg border border-gray-300 bg-white p-3 text-sm text-gray-700 placeholder-gray-500 outline-none focus:border-blue-400 focus:shadow-md dark:bg-gray-950 dark:text-white/80 dark:placeholder:text-white/60" />

                    <input type="date" formControlName="dateOfBirth"
                        class="block w-full rounded-lg border border-gray-300 bg-white p-3 text-sm text-gray-700 outline-none focus:border-blue-400 focus:shadow-md dark:bg-gray-950 dark:text-white/80" />

                    <select formControlName="gender"
                        class="block w-full rounded-lg border border-gray-300 bg-white p-3 text-sm text-gray-700 outline-none focus:border-blue-400 focus:shadow-md dark:bg-gray-950 dark:text-white/80">
                        <option value="">Select Gender</option>
                        <option *ngFor="let g of genders" [value]="g.value">{{ g.name }}</option>
                    </select>

                    <select formControlName="city"
                        class="block w-full rounded-lg border border-gray-300 bg-white p-3 text-sm text-gray-700 outline-none focus:border-blue-400 focus:shadow-md dark:bg-gray-950 dark:text-white/80">
                        <option value="">Select City</option>
                        <option *ngFor="let c of cities" [value]="c.value">{{ c.name }}</option>
                    </select>

                    <!-- <div class="form-group mb-3">
                        <label for="">Image Url</label>
                        <input type="file" (change)="onFileSelected($event)" class="mt-2 ms-2 d-block"
                            style="border-radius: 0px !important;" />
                    </div> -->



                    <button type="submit"
                        class="w-full rounded-lg bg-blue-500 px-4 py-3 text-sm font-bold text-white shadow-md transition-all hover:bg-blue-600 hover:shadow-lg active:opacity-85">
                        Sign Up
                    </button>

                </form>



            </div>
            <div class="border-black/12.5 rounded-b-2xl border-t-0 border-solid p-6 text-center pt-0 px-1 sm:px-6">
                <p class="mx-auto mb-6 leading-normal text-sm">Do you have an account?<a routerLink="/auth/signIn"
                        class="font-semibold text-transparent bg-clip-text bg-gradient-to-tl from-blue-500 to-violet-500">
                        Sign
                        in</a></p>
            </div>
        </div>
    </div>
    <div
        class="absolute top-0 right-0 flex-col justify-center hidden w-6/12 h-full max-w-full px-3 pr-0 my-auto text-center flex-0 lg:flex">
        <div
            class="relative flex flex-col justify-center h-full bg-cover px-24 m-4 overflow-hidden bg-[url('https://raw.githubusercontent.com/creativetimofficial/public-assets/master/argon-dashboard-pro/assets/img/signin-ill.jpg')] rounded-xl ">
            <span
                class="absolute top-0 left-0 w-full h-full bg-center bg-cover bg-gradient-to-tl from-blue-500 to-violet-500 opacity-60"></span>
            <h4 class="z-20 mt-12 font-bold text-white">"Attention is the new currency"</h4>
            <p class="z-20 text-white ">The more effortless the writing looks, the more effort the
                writer actually put into the process.</p>
        </div>
    </div>
</div>
