<section class="blogPageS1" *ngIf="newsDetails">
    <div class="blogPageS1-container px-120">
        <div class="blogPageS1-back"
            [style.background-image]="'url(https://localhost:7265/images/' + newsDetails.imageService + ')'">
            <div class="boxEmpty"></div>
            <div class="boxEmpty2"></div>
            <h1 class="colorWhite font-bold subtitle48px text-center" data-aos="fade-down">
                {{ newsDetails.title }}
            </h1>
            <div class="d-flex justify-content-center align-items-center fxDetailsBlog">
                <span class="font-medium subtitle22px colorBlack">By</span>
                <span class="font-medium subtitle22px color-linearGradient">{{ newsDetails.userName }}</span>
                <span>-</span>
                <span class="font-medium subtitle22px color-linearGradient">
                    {{ newsDetails.createdAt | date:'yyyy MMMM dd' }}
                </span>
            </div>
        </div>
    </div>
</section>

                </div>
                <h2 class="colorBlack subtitle20px font-semiBold mb16">Our latest news</h2>
                <div class="d-flex listInsights flex-column mb24" *ngIf="response?.news?.data">
                    <div class="d-flex listInsights-item align-items-center" *ngFor="
                                        let news of (response!.news.data | slice:0:3)
                                        ; let i = index
                                    ">
                        <img [src]="'https://localhost:7265/images/' + news.imageService" alt="news image"
                            class="listInsights-image" />
                        <div class="listInsights-text">
                            <span class="color-linearGradient subtitle16px font-medium numberLines">{{ news.createdAt |
                                date:'yyyy MMMM dd' }}</span>
                            <h3 class="colorBlack subtitle16px font-medium numberLines">{{ news.title }}</h3>
                        </div>
                    </div>
                </div>
                <div class="divTags">
                    <h2 class="colorBlack subtitle20px font-semiBold mb16">Popular tags</h2>
                    <div class="d-flex align-items-center justify-content-start tags">
                        <button *ngFor="let tag of newsDetails.hashtags" class="  tag-button">
                            <span class="color-linearGradient text-center font-medium">{{ tag }}</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
