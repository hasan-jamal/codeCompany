<section class="blogPageS1">
    <div class="blogPageS1-container px-120">
        <div class="blogPageS1-back">
            <div class="boxEmpty"></div>
            <h1 class="colorWhite font-bold subtitle64px text-center" data-aos="fade-down">
                {{ 'BlogPage.S1.TITLE' | translate }}
            </h1>
            <div class="boxButton">
                <button type="button" class="btn-hover bgNone" (click)="scrollToSection()">
                    <img src="assets/images/btnLinear-45deg.svg" alt="">
                </button>
            </div>
        </div>
    </div>
</section>

<section class="contactSection">
    <img src="assets/images/CONTACT-text.svg" alt="CONTACT-text" class="contact-text">
    <div class="contactSection-container px-120">
        <div class="contactSection-div d-flex">
            <div class="contactSection-texts">
                <h1 class="subtitle40px font-bold mb-0">
                    {{ 'BlogPage.Contact.Title' | translate }}
                </h1>
            </div>
            <div class="contactSection-buttons d-flex">
                <button class="btn-linearGradient" type="button" (click)="openTalkCodeModal()">
                    <span class="font-semiBold colorWhite subtitle20px">
                        {{ 'BlogPage.Contact.Button' | translate }}
                    </span>
                    <img src="assets/images/arrow-up-right.svg" alt="arrow-up-right">
                </button>
            </div>
        </div>
        <p class="mb-0 colorTwo style-font subtitle22px">
            {{ 'BlogPage.Contact.Description' | translate }}
        </p>
    </div>
</section>
