<div class="coverBack" id="coverBack" [class.show]="isOpen" (click)="close()"></div>

<div class="modal modalTalkCode" id="modalTalkCode" [class.show]="isOpen" (click)="$event.stopPropagation()">
    <div class="modal-content">
        <div class="boxContact">
            <div class="d-flex fx-boxContact">
                <div class="boxContact-text">
                    <img src="assets/images/talkCodeModal.svg" alt="mailbox icon">
                    <h1 class="font-bold colorBlack subtitle36px text-center">
                        {{ 'TALKMODAL.Title' | translate }}<br>
                        <span class="color-linearGradient">{{ 'TALKMODAL.Title2' | translate }}</span>
                    </h1>

                    <p class="style-font mb-0 subtitle16px colorOne text-center"
                        [innerHTML]="'TALKMODAL.Desc' | translate">
                    </p>
                </div>

                <div class="boxContact-form">
                    <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)">

                        <div class="form-group">
                            <input type="text" name="fullName" [(ngModel)]="formData.fullName" #fullName="ngModel"
                                class="style-font subtitle16px" [placeholder]="'TALKMODAL.PlaceholderName' | translate"
                                required />
                            <div *ngIf="fullName.invalid && fullName.touched" class="text-danger font-medium">
                                {{ 'TALKMODAL.ErrorName' | translate }}
                            </div>
                        </div>

                        <div class="form-group">
                            <input type="email" name="email" [(ngModel)]="formData.email" #email="ngModel"
                                class="style-font subtitle16px" [placeholder]="'TALKMODAL.PlaceholderEmail' | translate"
                                required />
                            <div *ngIf="email.invalid && email.touched" class="text-danger font-medium">
                                {{ 'TALKMODAL.ErrorEmail' | translate }}
                            </div>
                        </div>

                        <div class="form-group">
                            <input type="text" name="subject" [(ngModel)]="formData.subject" #subject="ngModel"
                                class="style-font subtitle16px"
                                [placeholder]="'TALKMODAL.PlaceholderSubject' | translate" required />
                            <div *ngIf="subject.invalid && subject.touched" class="text-danger font-medium">
                                {{ 'TALKMODAL.ErrorSubject' | translate }}
                            </div>
                        </div>

                        <div class="form-group">
                            <textarea name="message" [(ngModel)]="formData.message" #message="ngModel"
                                class="style-font subtitle16px"
                                [placeholder]="'TALKMODAL.PlaceholderMessage' | translate" required></textarea>
                            <div *ngIf="message.invalid && message.touched" class="text-danger font-medium">
                                {{ 'TALKMODAL.ErrorMessage' | translate }}
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="d-flex fxButtonsForm">
                                <button type="button" class="btnCancel subtitle16px font-medium btn-hover"
                                    (click)="close()">
                                    {{ 'TALKMODAL.CancelBtn' | translate }}
                                </button>

                                <button type="submit" [disabled]="loading || contactForm.invalid"
                                    class="subtitle16px font-medium colorWhite btn-linearGradient w-100">
                                    {{ loading ? ('TALKMODAL.Sending' | translate) : ('TALKMODAL.SendNow' | translate)
                                    }}
                                </button>
                            </div>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
