<section class="sectionInsights">
    <div class="sectionInsights-container px-120">
        <div class="divTitles d-flex align-items-center flex-column">
            <h1 class="font-bold subtitle40px text-center">Explore Insights From The CODE Team</h1>
            <p class="mb-0 style-font subtitle18px colorOne text-center">From expert articles to real-world case
                studies, this is
                where we
                share the thinking, results, and innovation behind our
                work.</p>
        </div>
        <div class="d-flex justify-content-between align-items-center fxTitle">
            <h3 class="font-medium subtitle24px color-linearGradient">Latest News</h3>
            <div class="arrows-Insights d-flex align-items-center gap-2">
                <img src="assets/images/rightBlog.svg" alt="Previous Slide" class="rightInsight transition3s ms-2"
                    style="cursor:pointer;" (click)="prevSlideInsight()">

                <img src="assets/images/leftBlog.svg" alt="Next Slide" class="leftInsight transition3s"
                    style="cursor:pointer;" (click)="nextSlideInsight()">
            </div>
        </div>

        <ngx-slick-carousel class="sliderInsights" #slickModalInsight="slick-carousel" [config]="slideConfigInsights">

            <div ngxSlickItem *ngFor="let Insight of Insights" class="slide">
                <div class="cardInsights m-2">
                    <div class="divImage">
                        <img [src]="Insight.image" alt="news-image" class="img-fluid" />
                    </div>
                    <div class="divContent">
                        <div class="d-flex divBtns">
                            <button class="btn-date colorWhite subtitle14px font-semiBold btn-linearGradient">{{
                                Insight.date }}</button>
                            <button class="btn-category subtitle14px color-linearGradient font-semiBold">
                                <span>{{Insight.category}}</span></button>
                        </div>
                        <h2 class="subtitle22px font-semiBold colorBlack2">{{ Insight.title }}</h2>
                        <p class="style-font subtitle16px colorBlack2">{{ Insight.description }}</p>
                        <a [href]="Insight.linkPost" target="_blank"
                            class="readMoreBtn d-flex align-items-center justify-content-start">
                            <img src="assets/images/HomePage/arrow-up-right.svg" alt="arrow-up-right">
                            <span class="colorOne font-bold text-uppercase subtitle14px">READ MORE</span>
                        </a>
                    </div>
                </div>
            </div>
        </ngx-slick-carousel>

    </div>
</section>
