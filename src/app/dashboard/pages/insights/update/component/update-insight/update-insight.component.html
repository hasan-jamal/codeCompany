<form [formGroup]="updateForm" (ngSubmit)="onSubmit()" *ngIf="insightDetails"
    class="flex flex-col gap-4 max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md space-y-6">

    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Title (EN)</label>
            <input type="text" formControlName="title"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Title (AR)</label>
            <input type="text" formControlName="title_ar" dir="rtl"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Category (EN)</label>
            <input type="text" formControlName="category"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Category (AR)</label>
            <input type="text" formControlName="category_ar" dir="rtl"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Description (EN)</label>
            <textarea formControlName="description" rows="3"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Description (AR)</label>
            <textarea formControlName="description_ar" rows="3" dir="rtl"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>
    </div>

    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">LinkedIn Post Link</label>
            <input type="text" formControlName="linkPost"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Secondary Link (Optional)</label>
            <input type="text" formControlName="linkPostSecondary"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Published Date</label>
            <input type="datetime-local" formControlName="publishedDate"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <div class="flex flex-col gap-2">
        <label class="block text-sm font-medium text-gray-700">Image</label>
        <div
            class="h-[200px] rounded-md overflow-hidden bg-gray-50 border border-gray-200 p-2 flex items-center justify-center relative boxImage">
            <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview" class="object-contain h-full rounded-lg" />
            <span *ngIf="!imagePreview" class="text-gray-400 absolute">No image selected</span>
            <input type="file" (change)="onFileSelected($event)" accept="image/*"
                class="absolute inset-0 opacity-0 cursor-pointer" />
        </div>
    </div>

    <div>
        <button type="submit" [disabled]="updateForm.invalid"
            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors duration-300">
            Update Insight
        </button>
    </div>

</form>

<div *ngIf="!insightDetails" class="text-center py-10 text-gray-500">
    Loading insight details...
</div>
