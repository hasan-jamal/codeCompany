<form [formGroup]="updateForm" (ngSubmit)="onSubmit()" *ngIf="updateUserProfileVM"
    class="flex flex-col gap-6 max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
    <div style="width: 40%;margin:auto;;"
        class="w-[200px] relative flex flex-col min-w-0 break-words bg-white border-0 shadow-xl dark:bg-slate-850 dark:shadow-dark-xl rounded-2xl bg-clip-border">
        <img class="w-full rounded-t-2xl" src="../assets/img/bg-profile.jpg" alt="profile cover image">
        <div class="flex flex-wrap justify-center -mx-3">
            <div class="w-4/12 max-w-full px-3 flex-0 ">
                <div class="mb-6 -mt-6 lg:mb-0 lg:-mt-16">
                    <a href="javascript:;">
                        <img class="h-auto max-w-full border-2 border-white border-solid rounded-circle"
                            src="../assets/img/team-2.jpg" alt="profile image">
                    </a>
                </div>
            </div>
        </div>
        <div class="border-black/12.5 rounded-t-2xl p-6 text-center pt-0 pb-6 lg:pt-2 lg:pb-4">
            <div class="flex justify-center">
                <button type="button"
                    class="hidden px-8 py-2 font-bold leading-normal text-center text-white align-middle transition-all ease-in border-0 rounded-lg shadow-md cursor-pointer text-xs bg-cyan-500 lg:block tracking-tight-rem hover:shadow-xs hover:-translate-y-px active:opacity-85">
                    change photo</button>
            </div>
        </div>

        <div class="flex-auto p-6 pt-0">
            <div class="mt-6 text-center">
                <h5 class="dark:text-white ">
                    Mark Davis
                </h5>
                <div class="mt-6 mb-2 font-semibold leading-relaxed text-base dark:text-white/80 text-slate-700">
                    <i class="mr-2 dark:text-white ni ni-briefcase-24"></i>
                    Solution Manager - Creative Tim Officer
                </div>

            </div>
        </div>
    </div>
    <!-- Full Name + Email -->
    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
            <input type="text" formControlName="fullName"
                class="block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input type="email" formControlName="email"
                class="block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <!-- Password + Phone Number -->
    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input type="password" formControlName="password"
                class="block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
            <input type="text" formControlName="phoneNumber"
                class="block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <!-- City + Date of Birth -->
    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
            <input type="text" formControlName="city"
                class="block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Date of Birth</label>
            <input type="date" formControlName="dateOfBirth"
                class="block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <!-- Gender -->
    <div class="flex flex-col">
        <label class="block text-sm font-medium text-gray-700 mb-2">Gender</label>
        <select formControlName="gender"
            class="block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="0">Male</option>
            <option value="1">Female</option>
        </select>
    </div>

    <!-- Profile Image -->
    <div class="flex flex-col gap-2">
        <label class="block text-sm font-medium text-gray-700">Profile Image</label>
        <div class="h-[200px]  rounded-md overflow-hidden bg-gray-50 flex items-center justify-center">
            <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview" class="object-contain" width="200" />
            <span *ngIf="!imagePreview" class="text-gray-400">No image selected</span>
        </div>
        <input type="file" (change)="onFileSelected($event)"
            class="mt-2 block rounded-md border border-gray-300 p-2 focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <!-- Submit -->
    <div class="flex justify-end">
        <button type="submit"
            class="bg-blue-500 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition-colors duration-300">
            Update Profile
        </button>
    </div>
</form>
