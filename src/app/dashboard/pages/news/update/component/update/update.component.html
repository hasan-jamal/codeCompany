<form [formGroup]="updateForm" (ngSubmit)="onSubmit()"
    class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md space-y-6">

    <div class="flex  gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Title (EN)</label>
            <input type="text" formControlName="title"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Title (AR)</label>
            <input type="text" formControlName="title_ar" dir="rtl"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <div class="flex  gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Description (EN)</label>
            <textarea name="" id="" formControlName="description"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Description (AR)</label>
            <textarea name="" id="" formControlName="description_ar"></textarea>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Phone</label>
            <input type="text" formControlName="phone"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Image URL</label>
            <input type="text" formControlName="imageService"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700">Hashtags</label>
        <input type="text" placeholder="#AI,#DataScience" [value]="hashtagsString" (input)="onHashtagsChange($event)"
            class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        <p class="text-gray-500 text-sm mt-1">اكتب الهاشتاغات مفصولة بفاصلة</p>
    </div>

    <!-- Submit -->
    <div>
        <button type="submit"
            class="w-full bg-blue-600 text-white p-3 rounded-md hover:bg-blue-700 transition font-semibold">Update</button>
    </div>

</form>
