<form [formGroup]="updateForm" (ngSubmit)="onSubmit()" *ngIf="subServiceSectionDetails"
    class="flex flex-col gap-4 max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md space-y-6">

    <!-- Titles -->
    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Title (EN)</label>
            <input type="text" formControlName="title"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Title (AR)</label>
            <input type="text" formControlName="title_ar" dir="rtl"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <!-- Subtitles -->
    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Subtitle (EN)</label>
            <input type="text" formControlName="subtitle"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Subtitle (AR)</label>
            <input type="text" formControlName="subtitle_ar" dir="rtl"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <!-- Descriptions -->
    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Description (EN)</label>
            <quill-editor formControlName="description" [style]="{height: '200px'}"></quill-editor>
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Description (AR)</label>
            <quill-editor formControlName="description_ar" dir="rtl" [style]="{height: '200px'}"></quill-editor>
        </div>
    </div>

    <!-- Image Upload -->
    <div class="flex flex-col gap-2">
        <label class="block text-sm font-medium text-gray-700">Image</label>
        <div class="  h-[200px]  rounded-md overflow-hidden bg-gray-50">
            <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview" class="object-contain rounded-lg"
                width="200" />
            <span *ngIf="!imagePreview" class="text-gray-400">No image selected</span>
            <input type="file" (change)="onFileSelected($event)"
                class="mt-1 block   rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

    </div>



    <!-- Submit -->
    <div>
        <button type="submit"
            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors duration-300">
            Update
        </button>
    </div>

</form>
