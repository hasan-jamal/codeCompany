<form [formGroup]="createSubServiceForm" (ngSubmit)="onSubmit()"
    class="flex flex-col gap-4 max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md space-y-6">

    <!-- Title EN & AR -->
    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Title (EN)</label>
            <input type="text" formControlName="title"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Title (AR)</label>
            <input type="text" formControlName="title_ar" dir="rtl"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
    </div>

    <!-- Service Brief EN & AR -->
    <div class="flex gap-4">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Service Brief (EN)</label>
            <textarea rows="3" formControlName="serviceBrief"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Service Brief (AR)</label>
            <textarea rows="3" formControlName="serviceBrief_ar" dir="rtl"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>
    </div>

    <!-- ServiceId -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Service</label>
        <select formControlName="serviceId"
            class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="" disabled selected>Select a service</option>
            <option *ngFor="let service of services" [value]="service.id">{{ service.title }}</option>
        </select>
    </div>

    <!-- Image Upload -->
    <div class="flex flex-col gap-2">
        <label class="block text-sm font-medium text-gray-700">Image</label>
        <div class="h-[200px] rounded-md overflow-hidden bg-gray-50 flex items-center justify-center">
            <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview" class="object-contain rounded-lg max-h-[200px]"
                width="200" />
            <span *ngIf="!imagePreview" class="text-gray-400">No image selected</span>
        </div>
        <input type="file" (change)="onFileSelected($event)"
            class="mt-2 block w-full rounded-md p-2 border border-gray-300 focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <!-- Submit -->
    <div>
        <button type="submit"
            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors duration-300">
            Create Sub Service
        </button>
    </div>
</form>
