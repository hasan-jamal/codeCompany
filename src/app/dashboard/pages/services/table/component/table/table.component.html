<div class="flex flex-wrap -mx-3" style="position: relative;">
    <div class="flex-none w-full max-w-full px-3">
        <div
            class="relative flex flex-col min-w-0 mb-6 break-words bg-white border-0 border-transparent border-solid shadow-xl dark:bg-slate-850 dark:shadow-dark-xl rounded-2xl bg-clip-border">

            <!-- Header -->
            <div
                class="p-6 pb-0 mb-4 border-b-0 border-b-solid rounded-t-2xl border-b-transparent flex items-center justify-between">
                <h6 class="dark:text-white">Services Table</h6>
                <button type="button" routerLink="/dashboard/services/create"
                    class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow-md hover:bg-blue-600 transition">
                    Add Service
                </button>
            </div>

            <!-- Table -->
            <div class="flex-auto px-0 pt-0 pb-2">
                <div class="p-0 overflow-x-auto">
                    <table
                        class="items-center w-full mb-0 align-top border-collapse dark:border-white/40 text-slate-500">
                        <thead class="align-bottom">
                            <tr>
                                <th
                                    class="px-6 py-3 font-bold text-left uppercase bg-transparent border-b border-collapse shadow-none dark:border-white/40 dark:text-white text-xxs border-b-solid tracking-none whitespace-nowrap text-slate-400 opacity-70">
                                    Title</th>
                                <th
                                    class="px-6 py-3 font-Tajawal text-left uppercase bg-transparent border-b border-collapse shadow-none dark:border-white/40 dark:text-white text-xxs border-b-solid tracking-none whitespace-nowrap text-slate-400 opacity-70 text-center">
                                    العنوان بالعربي
                                </th>
                                <th class=" px-6 py-3 font-bold text-center uppercase bg-transparent border-b
                                    border-collapse shadow-none dark:border-white/40 dark:text-white text-xxs
                                    border-b-solid tracking-none whitespace-nowrap text-slate-400 opacity-70">
                                    Archived</th>
                                <th
                                    class="px-6 py-3 font-bold text-center uppercase bg-transparent border-b border-collapse shadow-none dark:border-white/40 dark:text-white text-xxs border-b-solid tracking-none whitespace-nowrap text-slate-400 opacity-70">
                                    Create Date</th>
                                <th
                                    class="px-6 py-3 font-bold text-center uppercase bg-transparent border-b border-collapse shadow-none dark:border-white/40 dark:text-white text-xxs border-b-solid tracking-none whitespace-nowrap text-slate-400 opacity-70">
                                    Actions</th>
                            </tr>
                        </thead>

                        <tbody *ngIf="response?.service?.data?.length">
                            <tr *ngFor="
                                      let service of response?.service!.data

                                            | paginate
                                            : {
                                                id: 'server',
                                                itemsPerPage: response?.service?.pagination?.pageSize ,
                                                currentPage: response?.service?.pagination?.currentPage,
                                                totalItems: response?.service?.pagination?.rowCount
                                                }
                                                ;let i = index;">

                                <!-- Title + Image + User -->
                                <td
                                    class="p-2 align-middle bg-transparent border-b dark:border-white/40 whitespace-nowrap shadow-transparent">
                                    <div class="flex px-2 py-1">
                                        <div>
                                            <img [src]="'https://localhost:7265/images/' + service.imageService"
                                                class="inline-flex items-center justify-center mr-4 text-sm text-white transition-all duration-200 ease-in-out h-9 w-9 rounded-xl"
                                                alt="service-img" />
                                        </div>
                                        <div class="flex flex-col justify-center">
                                            <h6 class="mb-0 text-sm leading-normal dark:text-white">{{ service.title }}
                                            </h6>
                                            <p
                                                class="mb-0 text-xs leading-tight dark:text-white dark:opacity-80 text-slate-400">
                                                by {{ service.userName }}
                                            </p>
                                        </div>
                                    </div>
                                </td>
                                <td
                                    class="p-2 text-center align-middle bg-transparent border-b dark:border-white/40 whitespace-nowrap shadow-transparent">
                                    <span
                                        class="text-xs font-semibold leading-tight dark:text-white dark:opacity-80 text-slate-400 font-Tajawal">
                                        {{ service.title_ar}}
                                    </span>
                                </td>
                                <!-- Archived -->
                                <td class="text-center">
                                    <span *ngIf="service.archived" (click)="changeNotActivation(service.id, service)"
                                        class="bg-gradient-to-tl from-emerald-500 to-teal-400 px-2.5 text-xs rounded-1.8 py-1.4 block whitespace-nowrap text-center align-baseline font-bold uppercase leading-none text-white m-auto"
                                        style="width: max-content;">
                                        <img src="../../../../../../assets/dashboardImages/lock.svg" alt="lock"
                                            class="lock block m-auto">
                                    </span>
                                    <span *ngIf="!service.archived" (click)="changeActivation(service.id, service)"
                                        class="bg-gradient-to-tl from-slate-600 to-slate-300 px-2.5 text-xs rounded-1.8 py-1.4 block m-auto whitespace-nowrap text-center align-baseline font-bold uppercase leading-none text-white"
                                        style="width: max-content;">
                                        <img src="../../../../../../assets/dashboardImages/lock-off.svg" alt="lock-off"
                                            class="lock block m-auto">
                                    </span>
                                </td>

                                <!-- Sections Button -->
                                <td
                                    class="p-2 text-center align-middle bg-transparent border-b dark:border-white/40 whitespace-nowrap shadow-transparent">
                                    <button [routerLink]="['/dashboard/services/tableSections', service.id]"
                                        class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow-md hover:bg-blue-600 transition text-xxs">Sections</button>
                                </td>

                                <!-- Actions -->
                                <td
                                    class="p-2 align-middle bg-transparent border-b dark:border-white/40 whitespace-nowrap shadow-transparent">
                                    <div
                                        class="flex items-center justify-center gap-3 text-xs font-semibold leading-tight text-slate-400 transition-all duration-200 ease-in-out hover:text-slate-600 dark:hover:text-white">
                                        <a [routerLink]="['../update', service.id]"
                                            class="text-xs font-semibold dark:text-white text-slate-400">
                                            <span class="material-icons text-2xl">edit_square</span>
                                        </a>
                                        <a (click)="openDeleteModal(service)"
                                            class="text-xs font-semibold dark:text-white dark:opacity-80 text-red-600">
                                            <span class="material-icons text-2xl">delete</span>
                                        </a>
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                    </table>

                    <!-- Pagination -->
                    <div class="flex justify-center mt-4 gap-2 items-center">
                        <button
                            class="px-1 py-1 rounded bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 flex items-center"
                            (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">
                            <i class="material-icons text-2xl">chevron_left</i>
                        </button>

                        <button *ngFor="let page of [].constructor(totalPages); let i = index"
                            class="px-3 py-1 rounded hover:bg-gray-300 dark:hover:bg-gray-600"
                            [ngClass]="{'bg-blue-500 text-white': currentPage === i + 1, 'bg-gray-200 dark:bg-gray-700': currentPage !== i + 1}"
                            (click)="changePage(i + 1)">
                            {{ i + 1 }}
                        </button>

                        <button
                            class="px-1 py-1 rounded bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 flex items-center"
                            (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">
                            <i class="material-icons text-2xl">chevron_right</i>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="myModal" class="modal fade rounded-xl" *ngIf="isDeleteModalOpen">
        <div class="modal-dialog modal-confirm">
            <div class="modal-content">
                <div class="modal-header flex-column">
                    <div class="icon-box">
                        <i class="material-icons">&#xE5CD;</i>
                    </div>
                    <h4 class="modal-title w-100 mt-0">Are you sure?</h4>
                    <button type="button" class="close" (click)="closeDeleteModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Do you really want to delete this service? Once deleted, it cannot be recovered.</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button (click)="closeDeleteModal()" class="btn btn-secondary">Cancel</button>
                    <button class="btn btn-danger" (click)="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>
